name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Show Android SDK (preinstalled on runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Generate Gradle wrapper 8.11.1 (di folder kosong, lalu salin ke project)
        run: |
          mkdir -p "$RUNNER_TEMP/wrap"
          cd "$RUNNER_TEMP/wrap"
          touch settings.gradle
          gradle wrapper --gradle-version 8.11.1
          cp -r gradle gradlew gradlew.bat "$GITHUB_WORKSPACE/"
          chmod +x "$GITHUB_WORKSPACE/gradlew"

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LayarCCTV-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK as GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/debug/app-debug.apk LayarCCTV.apk
          gh release create "$TAG" LayarCCTV.apk \
            --title "Layar CCTV build ${GITHUB_RUN_NUMBER}" \
            --notes "APK debug, siap install di Google TV."
