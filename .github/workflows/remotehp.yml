name: Build Remote TV HP (Android)

on:
  push:
    paths:
      - 'RemoteHP/**'
      - '.github/workflows/remotehp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RemoteHP
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate Gradle wrapper 8.11.1
        run: |
          mkdir -p "$RUNNER_TEMP/wrap"
          cd "$RUNNER_TEMP/wrap"
          touch settings.gradle
          gradle wrapper --gradle-version 8.11.1
          cp -r gradle gradlew gradlew.bat "$GITHUB_WORKSPACE/RemoteHP/"
          chmod +x "$GITHUB_WORKSPACE/RemoteHP/gradlew"

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew :beranda:assembleDebug --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"
          mkdir -p app/src/main/assets
          cp beranda/build/outputs/apk/debug/beranda-debug.apk app/src/main/assets/beranda.apk
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Simpan log build bila gagal (cabang remotehp-log)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/log" && cd "$RUNNER_TEMP/log"
          git init -q
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          grep -n -E "error:|warning: \[|FAILED|What went wrong|\.java:[0-9]+" "$RUNNER_TEMP/build.log" | head -200 > ringkas.txt || true
          tail -c 200000 "$RUNNER_TEMP/build.log" > build.log
          git add . && git commit -q -m "log build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA})"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" HEAD:refs/heads/remotehp-log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RemoteTV-HP
          path: |
            RemoteHP/app/build/outputs/apk/debug/app-debug.apk
            RemoteHP/beranda/build/outputs/apk/debug/beranda-debug.apk
          if-no-files-found: error

      - name: Publish APK as GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="remotehp-${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/debug/app-debug.apk RemoteTV-HP.apk
          cp beranda/build/outputs/apk/debug/beranda-debug.apk BerandaTV.apk
          gh release create "$TAG" RemoteTV-HP.apk BerandaTV.apk --target "$GITHUB_SHA" \
            --title "Remote TV HP build ${GITHUB_RUN_NUMBER}" \
            --notes "Aplikasi Android remote untuk Google TV (ADB lewat WiFi)."
