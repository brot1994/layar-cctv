plugins {
    id 'com.android.application'
}

android {
    namespace 'com.agi.remotetv'
    compileSdk 36

    defaultConfig {
        applicationId "com.agi.remotetv"
        minSdk 21
        targetSdk 34
        versionCode 4
        versionName "1.3"
    }

    // Kunci tetap (di repo) supaya build berikutnya bisa dipasang menimpa versi lama
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
